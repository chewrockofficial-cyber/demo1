<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face {
  font-family: 'Galmuri11';
  src: url('https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri11.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Galmuri11';
  src: url('https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri11-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

/* 모달 각진 */
.gym-panel { border-radius:0!important; border-top-width: 3px !important; }
.sub-modal { border-radius:0!important; }
/* 인풋 각진 */
input[type=text], input[type=number], textarea, select {
  border-radius:0!important; border: 2px solid #111 !important;
  font-family: 'Galmuri11', monospace !important;
}
/* 난이도/조건 칩들 */
[class*="-chip"], [class*="-pill"], [class*="-tag"] { border-radius:0!important; }
/* 멤버 칩 각진 */
.member-chip { border-radius:0!important; }
/* 상점 카드 */
[class*="item-card"], [class*="product"] { border-radius:0!important; }


/* Chew Rock: Galmuri11 폰트만 적용 */
* { font-family: 'Galmuri11', 'Galmuri11', monospace !important; }
.phone { border-radius:0!important; overflow: hidden !important; }
.pill { border-radius:0!important; }
.notif-dot { border-radius:0!important; }
img { image-rendering: pixelated; }

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabi — 알림</title>
<style>
.px{font-family:'Galmuri11', monospace}
.px-title{font-family:'Galmuri11',monospace;font-weight:400 !important;letter-spacing:0.5px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f0f0f0;display:flex;justify-content:center;min-height:100vh}
.phone{width:360px;height:740px;background:#fff;border:2px solid #ddd;border-radius:0;margin:1rem auto;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;padding:30px 20px 12px;border-bottom:1.5px solid #eee;gap:12px;flex-shrink:0}
.back-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center}
.header-title{font-size:12px;color:#111;font-weight:400;letter-spacing:1px}
.notif-list{flex:1;overflow-y:auto;padding:4px 0}
.notif-list::-webkit-scrollbar{width:4px}
.notif-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px}
.empty-icon{font-size:40px}
.empty-text{font-size:10px;color:#999;letter-spacing:1px}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid #f5f5f5;cursor:pointer;position:relative}
.notif-item:active{background:#fafafa}
.notif-item.unread::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:#ff4444;border-radius:0}
.notif-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-icon-img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.notif-content{flex:1}
.notif-msg{font-size:10px;color:#222;line-height:1.7;word-break:keep-all}
.notif-msg strong{color:#111}
.notif-time{font-size:9px;color:#bbb;margin-top:4px}
.friend-btns{display:flex;gap:8px;margin-top:8px}
.btn-accept,.btn-reject{padding:6px 12px;border-radius:0;font-size:8px;border:none;cursor:pointer;font-family:'Galmuri11', monospace}
.btn-accept{background:#111;color:#fff}
.btn-reject{background:#f0f0f0;color:#888}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:0;padding:24px 20px 36px;width:360px;max-width:100vw}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:0;margin:0 auto 18px}
.modal-title{font-size:10px;color:#111;font-weight:400;letter-spacing:1px;margin-bottom:8px}
.modal-sub{font-size:9px;color:#999;margin-bottom:16px;line-height:1.6}
.gym-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.gym-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid #eee;border-radius:0;cursor:pointer;transition:border-color 0.15s}
.gym-item:hover{border-color:#111}
.gym-item.selected{border-color:#111;background:#fafafa}
.gym-icon{font-size:18px}
.gym-name{font-size:10px;color:#222}
.gym-members{font-size:9px;color:#bbb;margin-top:2px}
.modal-btns{display:flex;gap:8px}
.btn-confirm{flex:1;padding:12px;background:#111;color:#fff;border:none;border-radius:0;font-size:8px;cursor:pointer;font-family:'Galmuri11', monospace}
.btn-close-modal{flex:1;padding:12px;background:#f5f5f5;color:#666;border:none;border-radius:0;font-size:8px;cursor:pointer;font-family:'Galmuri11', monospace}
.btn-confirm:disabled{opacity:0.4;cursor:not-allowed}
.bottomnav{background:#fff;border-top:1.5px solid #eee;display:flex;padding:14px 0 20px;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 0;color:#bbb}
.nav-label{font-family:'Galmuri11', monospace;font-size:11px}
.nav-item.active{color:#111}
.nav-item.active .nav-label{color:#111}
</style>
</head>

  {id:9,type:'gym_create',icon:'🏔️',iconClass:'gym',msg:'<span>락 스튜디오 합정</span> 암장을 개업했습니다. (다른 나비를 초대해보세요!)',time:'7일 전',unread:false}
]
function render(){
  const list=document.getElementById('notif-list')
  if(!notifications.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🔔</div><div class="px empty-text">텅!</div><div style="font-size:10px;color:#bbb;margin-top:4px">아직 알림이 없어요</div></div>'
    return
  }
  list.innerHTML=notifications.map(n=>{
    const iconHtml = `<img class="notif-icon-img" src="${NOTIF_ICON_MAP[n.iconClass]}" alt="${n.iconClass}">`
    if(n.type==='friend') return `<div class="notif-item ${n.unread?'unread':''}" data-id="${n.id}"><div class="notif-icon">${iconHtml}</div><div class="notif-content"><div class="notif-msg">${n.msg}</div><div class="friend-btns"><button class="btn-accept px" onclick="acceptFriend(${n.id},event)">수락</button><button class="btn-reject px" onclick="rejectFriend(${n.id},event)">거절</button></div><div class="notif-time">${n.time}</div></div></div>`
    if(n.type==='hold') return `<div class="notif-item ${n.unread?'unread':''}" data-id="${n.id}" onclick="openHoldModal('${n.holdName}',${n.id})"><div class="notif-icon">${iconHtml}</div><div class="notif-content"><div class="notif-msg">${n.msg}</div><div class="notif-time">${n.time} · 탭해서 암장 선택</div></div></div>`
    return `<div class="notif-item ${n.unread?'unread':''}" data-id="${n.id}"><div class="notif-icon">${iconHtml}</div><div class="notif-content"><div class="notif-msg">${n.msg}</div><div class="notif-time">${n.time}</div></div></div>`
  }).join('')
}
function acceptFriend(id,e){
  e.stopPropagation()
  document.querySelector(`[data-id="${id}"]`).querySelector('.notif-content').innerHTML='<div class="notif-msg">친구 요청을 <span>수락</span>했습니다. 🎉</div><div class="notif-time">방금 전</div>'
}
function rejectFriend(id,e){
  e.stopPropagation()
  const item=document.querySelector(`[data-id="${id}"]`)
  item.style.opacity='0.4'
  item.style.pointerEvents='none'
}
let selectedGym=null
function openHoldModal(holdName,id){
  document.getElementById('modal-hold-name').textContent=holdName
  selectedGym=null
  document.querySelectorAll('.gym-item').forEach(el=>el.classList.remove('selected'))
  document.getElementById('btn-confirm').disabled=true
  document.getElementById('modal-backdrop').classList.add('show')
  const item=document.querySelector(`[data-id="${id}"]`)
  if(item) item.classList.remove('unread')
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('modal-backdrop')) return
  document.getElementById('modal-backdrop').classList.remove('show')
}
function selectGym(el,gymName){
  document.querySelectorAll('.gym-item').forEach(g=>g.classList.remove('selected'))
  el.classList.add('selected')
  selectedGym=gymName
  document.getElementById('btn-confirm').disabled=false
}
function confirmGym(){
  if(!selectedGym) return
  document.getElementById('modal-backdrop').classList.remove('show')
  const toast=document.createElement('div')
  toast.textContent=`✅ ${selectedGym}에 배치했어요!`
  Object.assign(toast.style,{position:'fixed',bottom:'40px',left:'50%',transform:'translateX(-50%)',background:'#111',color:'#fff',padding:'12px 20px',borderRadius:'12px',fontSize:'10px',zIndex:'999',whiteSpace:'nowrap'})
  document.body.appendChild(toast)
  setTimeout(()=>toast.remove(),2500)
}
render()
</script>
</body>
</html>
