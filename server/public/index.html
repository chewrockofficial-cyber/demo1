<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabi</title>
<style>
@font-face {
  font-family: 'Galmuri14';
  src: url('https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri14.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
* { font-family: 'Galmuri14', 'Galmuri14', monospace !important; }
.phone { border-radius:0!important; overflow: hidden !important; }
.pill  { border-radius:0!important; }
.notif-dot { border-radius:0!important; }
img { image-rendering: pixelated; }
</style>
<style>
html, body {
  margin: 0; padding: 0;
  background: #f0f0f0;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
</style>
</head>
<body>
<style>
.px{font-family:'Galmuri14', monospace}
.px-title{font-family:'Galmuri14',monospace;font-weight:400 !important;letter-spacing:0.5px}
*{box-sizing:border-box;margin:0;padding:0}
.phone{
  width:360px;height:740px;background:#fff;
  border:2px solid #ddd;border-radius:0;
  margin:1rem auto;display:flex;flex-direction:column;overflow:hidden
}
.topbar{display:flex;justify-content:flex-end;align-items:center;padding:38px 38px 4px}
.notif-wrap{position:relative;display:inline-block}
.notif-dot{width:9px;height:9px;background:#ff4444;border:2px solid #fff;border-radius:0;position:absolute;top:-2px;right:-2px}
.stage-area{text-align:center;padding:44px 0 2px}
.stage-text{font-size:18px;color:#111;letter-spacing:1px}
.stage-sub{font-size:10px;color:#888}
.stage-sub-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.stage-info-btn{background:none;border:1.5px solid #bbb;border-radius:50%;width:14px;height:14px;color:#999;font-size:9px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.stage-info-btn:active{transform:scale(0.9)}

.stageinfo-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:700;align-items:center;justify-content:center}
.stageinfo-backdrop.show{display:flex}
.stageinfo-card{background:#fff;border:2px solid #111;width:86%;max-width:320px;max-height:80vh;overflow-y:auto;padding:20px 18px}
.stageinfo-title{font-size:14px;color:#111;text-align:center;margin-bottom:4px}
.stageinfo-sub{font-size:10px;color:#999;text-align:center;margin-bottom:16px}
.stageinfo-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee}
.stageinfo-row:last-child{border-bottom:none}
.stageinfo-row.current{background:#fafafa}
.stageinfo-img{width:44px;height:auto;image-rendering:pixelated;flex-shrink:0}
.stageinfo-name{font-size:12px;color:#111}
.stageinfo-cond{font-size:10px;color:#999;margin-top:3px}
.stageinfo-badge{font-size:8px;background:#111;color:#fff;padding:2px 6px;margin-left:6px;vertical-align:middle}
.stageinfo-warning{font-size:10px;color:#c0392b;background:#fdf2f1;border:1px solid #f0d0cd;padding:10px 12px;margin-top:14px;line-height:1.5}
.pills{display:flex;gap:5px;justify-content:center;padding:10px 16px 4px;flex-wrap:wrap}
.pill{font-size:8px;padding:5px 8px;border-radius:0;border:1.5px solid #ddd;color:#bbb;background:#f8f8f8;font-family:'Galmuri14', monospace}
.pill.active{border-color:#222;color:#111;background:#fff}
.char-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.nabi-img{width:130px;height:auto;image-rendering:pixelated;display:block;cursor:pointer;margin-top:-28px}
.chalk-row{display:flex;align-items:center;gap:10px;margin-top:18px}
.chalk-img{width:34px;height:auto;image-rendering:pixelated;display:block}
.chalk-text{display:flex;align-items:baseline;gap:6px}
.chalk-count{font-size:17px;color:#111}
.chalk-unit{font-size:17px;color:#999}
.bottomnav{background:#fff;border-top:1.5px solid #eee;display:flex;padding:14px 0 20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.nav-label{font-size:11px;color:#bbb;font-family:'Galmuri14', monospace}
.nav-item.active .nav-label{color:#111}

/* ============================================================
   PIXEL BUTTON DESIGN SYSTEM (Chew Rock 공통 컴포넌트)
   - 모든 화면(index/gym/shop/record/notification)에 동일하게 적용
   ============================================================ */
:root{
  --pxb-ink:#1a1a1a;
  --pxb-border:2px;
  --pxb-radius:0px;
  --pxb-shadow:0px;
}

/* 기본 버튼 (흰 배경 / 활성) */
.btn-px{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;
  background:#fff;
  border:var(--pxb-border) solid var(--pxb-ink);
  border-radius:0;
  box-shadow:none;
  font-family:'Galmuri14','Galmuri14', monospace;
  font-weight:400;font-size:14px;color:var(--pxb-ink);
  cursor:pointer;user-select:none;
  transition:transform .06s ease, box-shadow .06s ease;
}
.btn-px:active{
  transform:scale(0.97);
}
.btn-px::before{
  content:"";position:absolute;inset:6px;pointer-events:none;
  background-repeat:no-repeat;background-size:5px 5px;
  background-position:0 0,100% 0,0 100%,100% 100%;
  background-image:
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%);
}
/* 보조(회색) 버튼 */
.btn-px.secondary{background:#dcdde0}
/* 비활성 버튼 */
.btn-px.disabled{
  background:#f0f0f0;color:#bbb;border-color:#ccc;
  box-shadow:none;
  cursor:not-allowed;pointer-events:none;
}
.btn-px.disabled::before{opacity:.25}

/* 정사각 아이콘 버튼 (×, +, ↑, ← 등) */
.icon-btn-px{
  position:relative;flex-shrink:0;
  width:38px;height:38px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:var(--pxb-border) solid var(--pxb-ink);
  border-radius:0;
  box-shadow:none;
  font-size:16px;font-weight:400;color:var(--pxb-ink);line-height:1;
  cursor:pointer;transition:transform .06s ease, box-shadow .06s ease;
}
.icon-btn-px:active{transform:scale(0.94)}
.icon-btn-px::before{
  content:"";position:absolute;inset:5px;pointer-events:none;
  background-repeat:no-repeat;background-size:4px 4px;
  background-position:0 0,100% 0,0 100%,100% 100%;
  background-image:
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%),
    radial-gradient(circle,rgba(0,0,0,.4) 42%,transparent 43%);
}

/* 아이템/재화 칩 (쵸크 x120 스타일) */
.chip-px{
  position:relative;
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px 6px 6px;
  cursor:pointer;transition:transform .06s ease;
}
.chip-px:active{transform:scale(0.96)}
.chip-px-icon{
  width:42px;height:42px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.chip-px-icon img{width:100%;height:auto;object-fit:contain;image-rendering:pixelated}
.chip-px-text{font-family:'Galmuri14',monospace;font-weight:400;font-size:12px;color:var(--pxb-ink);white-space:nowrap}

/* 패널/모달 컨테이너 (통일된 테두리) */
.card-px{
  background:#fff;border:var(--pxb-border) solid var(--pxb-ink);
  border-radius:0;
  box-shadow:none;
}

/* 마이페이지 모달 */
.mypage-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:600;align-items:flex-end;justify-content:center}
.mypage-backdrop.show{display:flex}
.mypage-modal{background:#fff;width:360px;max-width:100vw;max-height:82vh;display:flex;flex-direction:column;
  border:var(--pxb-border) solid var(--pxb-ink);border-bottom:none;border-radius:0}
.mypage-handle{width:40px;height:4px;background:#ddd;border:1px solid #ccc;margin:12px auto 0;flex-shrink:0}
.mypage-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:2px solid #eee;flex-shrink:0}
.mypage-name{font-size:16px;color:#111;letter-spacing:0.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mypage-name::after{content:'✎';font-size:11px;color:#aaa}
.name-edit-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:700;align-items:center;justify-content:center}
.name-edit-backdrop.show{display:flex}
.name-edit-card{background:#fff;border:2px solid #111;width:82%;max-width:280px;padding:20px 18px}
.name-edit-title{font-size:14px;color:#111;text-align:center;margin-bottom:14px}
.name-edit-input{width:100%;border:2px solid #111;padding:10px 12px;font-size:13px;font-family:'Galmuri14',monospace;outline:none;margin-bottom:6px;box-sizing:border-box}
.name-edit-error{font-size:10px;color:#e63946;min-height:14px;margin-bottom:10px}
.name-edit-btn{width:100%;padding:10px;background:#111;color:#fff;border:2px solid #000;font-size:12px;cursor:pointer;margin-top:4px}
.name-edit-btn:active{transform:scale(0.97)}
.name-edit-cancel{width:100%;padding:8px;margin-top:8px;background:#fff;border:2px solid #111;font-size:11px;cursor:pointer;color:#555}

/* 접속 달력 모달 */
.calendar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:700;align-items:center;justify-content:center}
.calendar-backdrop.show{display:flex}
.calendar-card{background:#fff;border:2px solid #111;width:88%;max-width:320px;padding:18px 16px}
.calendar-title{font-size:14px;color:#111;text-align:center;margin-bottom:14px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-weekday{font-size:9px;color:#999;text-align:center;padding-bottom:4px}
.calendar-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#333;border:1px solid #eee;gap:1px}
.calendar-cell.empty{border:none}
.calendar-cell img{width:14px;height:auto;image-rendering:pixelated}
.mypage-sub{font-size:10px;color:#999;margin-top:4px}
.mypage-code-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;flex-shrink:0}
.mypage-code-btn img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated;display:block}
.mypage-code-btn:active{transform:scale(0.9)}
.mycode-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:700;align-items:center;justify-content:center}
.mycode-backdrop.show{display:flex}
.mycode-card{background:#fff;border:2px solid #111;width:82%;max-width:280px;padding:20px 18px}
.mycode-title{font-size:14px;color:#111;text-align:center;margin-bottom:4px}
.mycode-sub{font-size:10px;color:#999;text-align:center;margin-bottom:14px}
.mycode-box{display:flex;align-items:center;justify-content:space-between;border:2px solid #111;padding:10px 12px;background:#fafafa}
.mycode-text{font-size:17px;color:#111;letter-spacing:3px}
.mycode-copy-btn{background:#111;color:#fff;border:none;padding:6px 12px;font-size:11px;cursor:pointer}
.mycode-copy-btn:active{transform:scale(0.95)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border:2px solid #222;font-size:11px;z-index:999;white-space:nowrap;display:none}
.toast.show{display:block}
.mypage-body{overflow-y:auto;padding:16px 18px 24px;flex:1}
.mypage-section-title{font-size:11px;color:#888;margin-bottom:10px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.stat-card:active{transform:scale(0.97)}
.stat-card-icon{font-size:18px}
.stat-card-value{font-size:20px;color:#111;line-height:1.1;margin-top:2px}
.stat-card-label{font-size:10px;color:#888}
.stat-card-delta{font-size:10px;margin-top:2px}
.stat-card-delta.up{color:#2a9d8f}
.stat-card-delta.down{color:#e63946}
.stat-card-delta.flat{color:#999}

/* 소형 버튼 (카드 내부용) */
.btn-px.sm{padding:10px 16px;font-size:13px}
.btn-px.sm:active{transform:scale(0.96)}
.btn-px.sm.disabled{box-shadow:none}

/* 쵸크 대시보드 */
.dash-section{margin-bottom:20px}
.dash-section-title{font-size:13px;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.dash-card{border:2px solid #eee;border-radius:0;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#fafafa}
.dash-card-icon{width:32px;height:32px;border-radius:0;background:#fff;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.dash-card-info{flex:1;min-width:0}
.dash-card-title{font-size:14px;color:#111}
.dash-card-desc{font-size:11px;color:#999;margin-top:4px;line-height:1.5}
.dash-progress-bar{height:6px;background:#eee;border-radius:0;overflow:hidden;margin-top:6px}
.dash-progress-fill{height:100%;background:#2a9d8f;transition:width .2s}
</style>

  <div class="topbar">
    <div class="notif-wrap" onclick="window.location.href='notification.html'" style="cursor:pointer">
      <img id="notifIcon" src="" alt="알림" style="width:26px;height:auto;image-rendering:pixelated;display:block" />

  var countEl = document.querySelector('.chalk-count');
  var imgEl = document.querySelector('.chalk-img');
  if (countEl && imgEl) applyChalkIcon(parseInt(countEl.textContent, 10) || 0, imgEl);

  var notifEl = document.getElementById('notifIcon');
  if (notifEl) notifEl.src = hasUnreadNotifications ? NOTIF_ICON_UNREAD : NOTIF_ICON_READ;
});

function setNav(i) {
  // 페이지 이동
  const pages = ['/', '/records.html', '/', '/shop.html']
  // 메인(0), 기록(1), 마을(2)은 아직 없으니까 상점만 이동
  if (i === 3) {
    window.location.href = '/shop.html'
    return
  }
  document.querySelectorAll('.nav-item').forEach((el, idx) => {
    el.classList.toggle('active', idx === i)
  });
}

var NABI_STAGES = [
  { name: 'Fresh Nabi',   cond: '최근 30일 내 기록 0~4개',    minRecords: 0 },
  { name: 'Dusted Nabi',  cond: '최근 30일 내 기록 5개 이상',  minRecords: 5 },
  { name: 'Powdered Nabi',cond: '최근 30일 내 기록 15개 이상', minRecords: 15 },
  { name: 'Coated Nabi',  cond: '최근 30일 내 기록 30개 이상', minRecords: 30 },
  { name: 'Caked Nabi',   cond: '최근 30일 내 기록 50개 이상', minRecords: 50 }
];
function getNabiStageFromRecords(count) {
  var stage = 1;
  for (var i = 0; i < NABI_STAGES.length; i++) {
    if (count >= NABI_STAGES[i].minRecords) stage = i + 1;
  }
  return stage;
}
var CURRENT_STAGE = 1; // MY_ACTIVITY_30D 정의 이후 실제 기록 수 기준으로 재계산됨
function openStageInfo() {
  var listEl = document.getElementById('stageinfoList');
  listEl.innerHTML = NABI_STAGES.map(function(s, i) {
    var stageNum = i + 1;
    var isCurrent = stageNum === CURRENT_STAGE;
    return (
      '<div class="stageinfo-row' + (isCurrent ? ' current' : '') + '">' +
        '<img class="stageinfo-img" src="' + NABI_STAGE_IMGS[i] + '" alt="' + s.name + '">' +
        '<div>' +
          '<div class="px stageinfo-name">Lv.' + stageNum + ' ' + s.name + (isCurrent ? '<span class="px stageinfo-badge">현재</span>' : '') + '</div>' +
          '<div class="px stageinfo-cond">' + s.cond + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  document.getElementById('stageinfoBackdrop').classList.add('show');
}
function closeStageInfo(e) {
  if (e && e.target !== document.getElementById('stageinfoBackdrop')) return;
  document.getElementById('stageinfoBackdrop').classList.remove('show');
}

function toast2(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

function getMyCode() {
  try {
    var u = JSON.parse(localStorage.getItem('user') || 'null') || {};
    if (!u.friendCode) {
      u.friendCode = String(Math.floor(100000 + Math.random() * 900000));
      localStorage.setItem('user', JSON.stringify(u));
    }
    return u.friendCode;
  } catch (e) {
    return '000000';
  }
}
function openMyCode() {
  document.getElementById('mycodeText').textContent = getMyCode();
  document.getElementById('mycodeBackdrop').classList.add('show');
}
function closeMyCode(e) {
  if (e && e.target !== document.getElementById('mycodeBackdrop')) return;
  document.getElementById('mycodeBackdrop').classList.remove('show');
}
function copyMyCode() {
  var code = getMyCode();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function(){ toast2('코드가 복사됐어요'); }).catch(function(){ toast2('코드: ' + code); });
  } else {
    toast2('코드: ' + code);
  }
}

function getMyNickname() {
  try {
    var u = JSON.parse(localStorage.getItem('user') || 'null');
    if (u && u.nickname) return u.nickname;
  } catch (e) {}
  return '나비';
}

// 다른 사용자들이 이미 쓰고 있는 이름 (실서비스 연동 전 목업 데이터)
var MOCK_TAKEN_NICKNAMES = ['회색나비', '분홍나비', '초크나비', '민트나비', '까만나비', '노랑나비', '주황나비', '하양나비'];

function openNameEdit() {
  var input = document.getElementById('nameEditInput');
  input.value = getMyNickname();
  document.getElementById('nameEditError').textContent = '';
  document.getElementById('nameEditBackdrop').classList.add('show');
  input.focus();
  input.addEventListener('keydown', function onKey(e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      submitNameEdit();
    }
  });
}
function closeNameEdit(e) {
  if (e && e.target !== document.getElementById('nameEditBackdrop')) return;
  document.getElementById('nameEditBackdrop').classList.remove('show');
}
function submitNameEdit() {
  var input = document.getElementById('nameEditInput');
  var errEl = document.getElementById('nameEditError');
  var newName = input.value.trim();
  if (!newName) { errEl.textContent = '이름을 입력해주세요'; return; }
  var current = getMyNickname();
  var isTaken = newName !== current && MOCK_TAKEN_NICKNAMES.some(function(n){ return n === newName; });
  if (isTaken) { errEl.textContent = '이미 사용한 나비가 있어!'; return; }
  var u = {};
  try { u = JSON.parse(localStorage.getItem('user') || '{}') || {}; } catch (e) {}
  u.nickname = newName;
  localStorage.setItem('user', JSON.stringify(u));
  document.getElementById('mypageName').textContent = newName;
  errEl.textContent = '';
  document.getElementById('nameEditBackdrop').classList.remove('show');
}

// 최근 30일 활동 현황 (실서비스 연동 전 목업 데이터)
var MY_ACTIVITY_30D = {
  records:  { value: 12, delta: +4,  label: '기록 횟수' },
  visits:   { value: 21, delta: +6,  label: '접속 일수' },
  friends:  { value: 5,  delta: +1,  label: '친구 수' },
  gyms:     { value: 3,  delta: 0,   label: '가입 암장 수' }
};

// '기록 횟수'(최근 30일)와 나비 단계는 같은 숫자를 기준으로 계산돼야 하므로 여기서 동기화
CURRENT_STAGE = getNabiStageFromRecords(MY_ACTIVITY_30D.records.value);
(function syncMainStageDisplay(){
  var s = NABI_STAGES[CURRENT_STAGE - 1];
  document.querySelector('.stage-text').textContent = s.name;
  document.querySelector('.stage-sub').textContent = 'stage ' + CURRENT_STAGE + ' / 5';
  document.querySelector('.nabi-img').src = NABI_STAGE_IMGS[CURRENT_STAGE - 1];
  var pills = document.querySelectorAll('#pillsRow .pill');
  pills.forEach(function(p, i) {
    p.classList.toggle('active', i === CURRENT_STAGE - 1);
  });
})();
var STAT_ACTIONS = {
  records: function(){ window.location.href = 'record.html'; },
  visits:  function(){ openVisitCalendar(); },
  friends: function(){ window.location.href = 'gym.html'; },
  gyms:    function(){ window.location.href = 'gym.html'; }
};

// 이번 달 접속한 날짜 (실서비스 연동 전 목업 데이터)
var MY_VISIT_DAYS = [1, 2, 3, 5, 6, 8, 9, 10, 11, 13, 15, 16, 17, 19, 20, 22, 23, 24, 26, 27, 29];
var WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

function openVisitCalendar() {
  var now = new Date();
  var year = now.getFullYear(), month = now.getMonth();
  document.getElementById('calendarTitle').textContent = year + '년 ' + (month + 1) + '월 접속 현황';
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var cells = WEEKDAY_LABELS.map(function(w){ return '<div class="px calendar-weekday">' + w + '</div>'; });
  for (var i = 0; i < firstDay; i++) cells.push('<div class="calendar-cell empty"></div>');
  for (var d = 1; d <= daysInMonth; d++) {
    var visited = MY_VISIT_DAYS.indexOf(d) !== -1;
    cells.push(
      '<div class="calendar-cell">' +
        (visited ? '<img src="' + CHALK_ICON_CLOUD + '" alt="접속">' : '') +
        '<span>' + d + '</span>' +
      '</div>'
    );
  }
  document.getElementById('calendarGrid').innerHTML = cells.join('');
  document.getElementById('calendarBackdrop').classList.add('show');
}
function closeVisitCalendar(e) {
  if (e && e.target !== document.getElementById('calendarBackdrop')) return;
  document.getElementById('calendarBackdrop').classList.remove('show');
}

function fmtDelta(d) {
  if (d > 0) return { text: '30일 전 대비 +' + d, cls: 'up' };
  if (d < 0) return { text: '30일 전 대비 ' + d, cls: 'down' };
  return { text: '30일 전과 동일', cls: 'flat' };
}

function openMyPage() {
  document.getElementById('mypageCodeIcon').src = ICON_CODE;
  document.getElementById('mypageName').textContent = getMyNickname();
  var statsEl = document.getElementById('mypageStats');
  statsEl.innerHTML = Object.keys(MY_ACTIVITY_30D).map(function(key) {
    var s = MY_ACTIVITY_30D[key];
    var deltaText, deltaCls;
    if (key === 'records') {
      // 나비 단계 계산에 쓰이는 값이라, 비교값 대신 실제 30일 내 기록 수를 그대로 보여줘서 직관적으로 이해되게
      deltaText = '30일 내 기록 ' + s.value + '개';
      deltaCls = 'flat';
    } else {
      var d = fmtDelta(s.delta);
      deltaText = d.text;
      deltaCls = d.cls;
    }
    return (
      '<div class="stat-card card-px" data-key="' + key + '">' +
        '<div class="px stat-card-value">' + s.value + '</div>' +
        '<div class="px stat-card-label">' + s.label + '</div>' +
        '<div class="px stat-card-delta ' + deltaCls + '">' + deltaText + '</div>' +
      '</div>'
    );
  }).join('');
  Array.prototype.forEach.call(statsEl.querySelectorAll('.stat-card'), function(card){
    card.onclick = STAT_ACTIONS[card.getAttribute('data-key')];
  });
  document.getElementById('mypageBackdrop').classList.add('show');
}
function closeMyPage(e) {
  if (e && e.target !== document.getElementById('mypageBackdrop')) return;
  document.getElementById('mypageBackdrop').classList.remove('show');
}
</script>
