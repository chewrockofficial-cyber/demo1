<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face {
  font-family: 'Galmuri14';
  src: url('https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri14.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}

/* 모달 각진 */
.gym-panel { border-radius:0!important; border-top-width: 3px !important; }
.sub-modal { border-radius:0!important; }
/* 인풋 각진 */
input[type=text], input[type=number], textarea, select {
  border-radius:0!important; border: 2px solid #111 !important;
  font-family: 'Galmuri14', monospace !important;
}
/* 난이도/조건 칩들 */
[class*="-chip"], [class*="-pill"], [class*="-tag"] { border-radius:0!important; }
/* 멤버 칩 각진 */
.member-chip { border-radius:0!important; }
/* 상점 카드 */
[class*="item-card"], [class*="product"] { border-radius:0!important; }


/* Chew Rock: Galmuri14 폰트만 적용 */
* { font-family: 'Galmuri14', 'Galmuri14', monospace !important; }
.phone { border-radius:0!important; overflow: hidden !important; }
.pill { border-radius:0!important; }
.notif-dot { border-radius:0!important; }
img { image-rendering: pixelated; }

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabi — 기록</title>
<style>
.px{font-family:'Galmuri14', monospace}
.px-title{font-family:'Galmuri14',monospace;font-weight:400 !important;letter-spacing:0.5px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f0f0f0;display:flex;justify-content:center;min-height:100vh}
.phone{width:360px;height:740px;background:#fff;border:2px solid #ddd;border-radius:0;margin:1rem auto;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{display:flex;justify-content:space-between;align-items:center;padding:32px 24px 20px;flex-shrink:0}
.header-title{font-size:18px;color:#111;font-weight:400;letter-spacing:1px}
.header-title-sign{height:40px;width:auto;image-rendering:pixelated;display:block;margin-left:-24px}
.header-right{display:flex;align-items:center;gap:8px}
.streak-badge{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border:1.5px solid #111;border-radius:0;padding:5px 9px;flex:1;min-width:0;height:31px;box-sizing:border-box}
.streak-text{white-space:nowrap}
.chalk-badge{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border:1.5px solid #111;border-radius:0;padding:5px 9px;flex:1;min-width:0;height:31px;box-sizing:border-box}
.streak-text{font-size:12px;color:#e65100}
.chalk-text{font-size:12px;color:#111}
.today-card{margin:0 24px 20px;background:#fafafa;border:1.5px solid #111;border-radius:0;padding:16px;flex-shrink:0}
.today-status{font-size:12px;color:#888;margin-bottom:6px;line-height:1.6}
.today-status strong{color:#111}
.btn-record{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:0;font-size:12px;cursor:pointer;letter-spacing:1px;margin-top:10px}
.view-tabs{display:flex;margin:0 24px 16px;gap:6px;flex-shrink:0}
.view-tab{flex:1;padding:8px;border:1.5px solid #111;border-radius:0;background:#f8f8f8;color:#bbb;font-size:12px;text-align:center;cursor:pointer;letter-spacing:0.5px}
.view-tab.active{border-color:#111;background:#fff;color:#111}
.scroll-area{flex:1;overflow-y:auto;padding:0 24px 8px}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:#ddd;border-radius:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:40px 20px}
.empty-icon{font-size:44px}
.empty-title{font-size:12px;color:#999;letter-spacing:0.5px;text-align:center;line-height:1.8}
.btn-first-record{margin-top:8px;padding:11px 20px;background:#111;color:#fff;border:none;border-radius:0;font-size:12px;cursor:pointer}
.record-card{background:#fff;border:1.5px solid #111;border-radius:0;padding:14px;margin-bottom:18px;cursor:pointer}
.record-card:active{background:#fafafa}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-date{font-size:12px;color:#111}
.card-gym{font-size:12px;color:#111;margin-top:3px}
.card-header-right{display:flex;flex-direction:row;align-items:center;gap:6px}
.card-header-right .nabi-grow-badge{flex:1.1;justify-content:center;height:24px;box-sizing:border-box;padding:2px 6px;white-space:nowrap}
.card-header-right .card-reward{flex:1.2;justify-content:center;height:24px;box-sizing:border-box;padding:2px 6px;white-space:nowrap}
.card-reward{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #111;border-radius:0;padding:2px 6px}
.card-reward-text{font-size:11px;color:#111}
.card-photo{width:100%;height:100px;background:#f5f5f5;border-radius:0;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.card-photo-empty{font-size:28px;opacity:0.4}
.card-stats{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card-stat{display:flex;align-items:center;justify-content:center;gap:4px;background:#f8f8f8;border:1.5px solid #111;border-radius:0;padding:0 6px;height:22px;box-sizing:border-box}
.card-stat-text{font-size:11px;color:#555}
.card-memo{font-size:12px;color:#666;line-height:1.6;border-top:1px solid #f0f0f0;padding-top:8px}
.nabi-grow-badge{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #111;border-radius:0;padding:2px 6px}
.nabi-grow-text{font-size:11px;color:#111}
.calendar-wrap{padding:4px 0}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-month{font-size:12px;color:#111}
.cal-nav{background:none;border:none;cursor:pointer;font-size:13px;color:#888;padding:4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-day-label{text-align:center;font-size:12px;color:#bbb;padding:4px 0}
.cal-day{text-align:center;padding:6px 2px;border-radius:0;cursor:pointer;position:relative}
.cal-day.today{background:#111}
.cal-day.today .day-num{color:#fff}
.day-num{font-size:12px;color:#333}
.day-dot{width:5px;height:5px;margin:2px auto 0;border-radius:0;background:transparent}
.cal-day.has-record .day-dot{background:#e65100}
.cal-day.selected{background:#f5f5f5;border:1.5px solid #ddd}
.cal-selected-records{margin-top:12px;border-top:1px solid #eee;padding-top:12px}
.cal-selected-title{font-size:12px;color:#888;margin-bottom:8px}
.cal-record-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fafafa;border-radius:0;margin-bottom:6px;cursor:pointer}
.cal-record-gym{font-size:12px;color:#111}
.cal-record-sub{font-size:12px;color:#bbb;margin-top:2px}
.cal-empty{font-size:12px;color:#bbb;text-align:center;padding:20px 0}
.modal-backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:0;width:360px;max-width:100%;max-height:92%;display:flex;flex-direction:column}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:0;margin:16px auto 0}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 12px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.modal-title{font-size:12px;color:#111;font-weight:400;letter-spacing:1px}
.modal-close{background:none;border:none;cursor:pointer;font-size:16px;color:#bbb}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1}
.modal-footer{padding:12px 20px 32px;border-top:1px solid #f0f0f0;flex-shrink:0}
.form-section{margin-bottom:16px}
.form-label{font-size:12px;color:#888;margin-bottom:6px;letter-spacing:0.5px}
.photo-upload{width:100%;height:110px;border:2px dashed #ddd;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#fafafa}
.photo-upload-icon{font-size:28px;opacity:0.5}
.photo-upload-text{font-size:7px;color:#bbb}
.form-input{width:100%;padding:12px 14px;border:1.5px solid #111;border-radius:0;font-size:12px;color:#111;background:#fff;outline:none;font-family:inherit}
.form-input:focus{border-color:#111}
.form-input::placeholder{color:#ccc}
.grade-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grade-row{display:flex;align-items:center;gap:8px;border:1.5px solid #111;border-radius:0;padding:6px 8px}
.grade-row.on{border-color:#111;background:#fafafa}
.grade-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0}
.grade-name{font-size:12px;color:#555;flex:1;white-space:nowrap}
.grade-count-box{display:flex;align-items:center;gap:2px}
.grade-btn{width:26px;height:26px;background:#f2f2f2;border:none;cursor:pointer;font-size:12px;color:#555;border-radius:0;line-height:1;padding:0}
.grade-count{min-width:18px;text-align:center;font-size:12px;color:#111;font-family:'Galmuri14', monospace}
.grade-total{margin-top:10px;font-size:12px;color:#111;text-align:right}
.grade-total b{font-family:'Galmuri14', monospace;font-size:12px}
.grade-chips{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.grade-chip{display:flex;align-items:center;justify-content:center;gap:3px;background:#f8f8f8;border:1.5px solid #111;border-radius:0;padding:0 6px;height:22px;box-sizing:border-box}
.grade-chip-dot{width:10px;height:10px;border-radius:50% !important;border:1px solid #111;flex-shrink:0}
.grade-chip-num{font-size:11px;color:#333;font-family:'Galmuri14', monospace}
.optional-toggle{display:flex;align-items:center;gap:6px;padding:10px 0;cursor:pointer;color:#bbb;font-size:12px;border:none;background:none;width:100%}
.optional-section{display:none}
.optional-section.show{display:block}
.form-select{width:100%;padding:12px 14px;border:1.5px solid #111;border-radius:0;font-size:12px;color:#111;background:#fff;outline:none;font-family:inherit}
.btn-save{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:0;font-size:12px;cursor:pointer;letter-spacing:1px}
.detail-modal{background:#fff;border-radius:0;width:360px;max-width:100%;max-height:92%;display:flex;flex-direction:column}
.detail-header-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 14px;height:36px;flex-shrink:0}
.detail-edit-btn{background:none;border:none;cursor:pointer;padding:4px;width:28px;height:28px}
#detailFavIcon{filter:grayscale(100%) opacity(0.4)}
#detailFavIcon.active{filter:none}
.detail-edit-btn img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.detail-photo{width:100%;height:160px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:0.3;flex-shrink:0}
.detail-body{padding:20px;overflow-y:auto;flex:1}
.detail-gym{font-size:12px;color:#111;margin-bottom:4px}
.detail-date{font-size:12px;color:#bbb;margin-bottom:16px}
.detail-stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.detail-stat{display:flex;align-items:center;justify-content:center;gap:4px;background:#f8f8f8;border:1.5px solid #111;border-radius:0;padding:0 6px;height:22px;box-sizing:border-box}
.detail-stat-text{font-size:11px;color:#555}
.detail-memo{font-size:11px;color:#444;line-height:1.8;background:#fafafa;border-radius:0;padding:14px;margin-bottom:14px}
.detail-rewards{display:flex;gap:8px;flex-wrap:wrap}
.detail-reward{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:0;font-size:12px}
.detail-reward.chalk{background:#fff;border:1.5px solid #111;color:#111}
.detail-reward.nabi{background:#fff;border:1.5px solid #111;color:#111}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:0;font-size:12px;z-index:999;white-space:nowrap;display:none;letter-spacing:0.5px}
.toast.show{display:block}
.bottomnav{background:#fff;border-top:1.5px solid #eee;display:flex;padding:14px 0 20px;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 0;color:#bbb}
.nav-label{font-family:'Galmuri14', monospace;font-size:12px}
.nav-item.active{color:#111}
.nav-item.active .nav-label{color:#111}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <img class="header-title-sign" src="/images/sign_record.png" alt="RECORD">
    <div class="header-right">
      <div class="chalk-badge"><img id="chalkIcon" src="" alt="chalk" style="width:16px;height:auto;image-rendering:pixelated" /><span class="px chalk-text" id="chalkText">12꼬집</span></div>

<div class="modal-backdrop" id="writeModalBackdrop" onclick="closeWriteModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="px modal-title" id="modalTitleText">기록 업로드</div>
      <button class="modal-close" onclick="closeWriteModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <div class="px form-label">사진 / 영상 <span style="color:#e23b3b">*필수</span></div>
        <input type="file" id="inputPhotoFile" accept="image/*" style="display:none" onchange="handlePhotoSelect(event)">
        <div class="photo-upload" id="photoUploadBox" onclick="document.getElementById('inputPhotoFile').click()">
          <div class="photo-upload-icon">📷</div>
          <div class="px photo-upload-text">탭해서 사진 추가</div>
        </div>
      </div>
      <div class="form-section">
        <div class="px form-label">클라이밍장</div>
        <input class="form-input" id="inputGym" type="text" placeholder="예) 더클라임 강남">
      </div>
      <div class="form-section">
        <div class="px form-label">날짜</div>
        <input class="form-input" id="inputDate" type="date">
      </div>
      <div class="form-section">
        <div class="px form-label">완등한 난이도 (색깔별 개수)</div>
        <div class="grade-grid" id="gradeGrid"></div>
        <div class="grade-total">합계 <b id="gradeTotal">0</b> 개 루트</div>
      </div>
      <div class="form-section">
        <div class="px form-label">메모</div>
        <textarea class="form-input" id="inputMemo" rows="3" placeholder="오늘 클라이밍 어땠나요?"></textarea>
      </div>
      <button class="px optional-toggle" onclick="toggleOptional()">
        <span id="optToggleIcon">▶</span> 추가 정보 (선택)
      </button>
      <div class="optional-section" id="optionalSection">
        <div class="form-section" style="margin-top:12px">
          <div class="px form-label">컨디션</div>
          <select class="form-select" id="inputCond"><option value="">선택 안함</option><option>😊 최고</option><option>🙂 좋음</option><option>😐 보통</option><option>😪 피곤</option></select>
        </div>
        <div class="form-section">
          <div class="px form-label">운동 시간 (분)</div>
          <input class="form-input" id="inputDur" type="number" placeholder="예) 90" min="0">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="px btn-save" onclick="saveRecord()"><span id="btnSaveText">기록 저장하기</span></button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="detailModalBackdrop" onclick="closeDetailModal(event)">
  <div class="detail-modal" onclick="event.stopPropagation()">
    <div class="modal-handle" style="margin-bottom:0"></div>
    <div class="detail-header-row">
      <button class="detail-edit-btn" id="detailFavBtn" onclick="toggleFavoriteRecord()"><img src="" id="detailFavIcon" alt="즐겨찾기"></button>
      <button class="detail-edit-btn" id="detailEditBtn" onclick="openEditModal()"><img src="" id="detailEditIcon" alt="수정"></button>

      <div class="detail-stats" id="detailStats"></div>
      <div class="detail-memo" id="detailMemo"></div>
      <div class="detail-rewards" id="detailRewards"></div>
    </div>

let routeCount=0,currentView='feed',selectedCalDate=null,calYear=2026,calMonth=7

function init(){
  document.getElementById('inputDate').value=todayStr()
  updateHeader();renderFeed();renderCalendar()
}
function todayStr(){return new Date().toISOString().split('T')[0]}
function updateHeader(){
  document.getElementById('chalkText').textContent=state.chalkCount+'꼬집'
  applyChalkIcon(state.chalkCount, document.getElementById('chalkIcon'))
  document.getElementById('todayStatus').innerHTML=state.todayRecorded
    ?'오늘 클라이밍 기록을 남겼어요 🎉<br><span>나비가 잘 자라고 있어요!</span>'
    :'오늘의 클라이밍을 기록하고 나비를 성장시켜요'
}
function switchView(v){
  currentView=v
  document.getElementById('tab-feed').classList.toggle('active',v==='feed')
  document.getElementById('tab-cal').classList.toggle('active',v==='calendar')
  document.getElementById('feedView').style.display=v==='feed'?'block':'none'
  document.getElementById('calView').style.display=v==='calendar'?'block':'none'
}
function renderFeed(){
  const el=document.getElementById('feedView')
  if(!state.records.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">🧗</div><div class="px empty-title">아직 기록이 없어요<br><br>첫 클라이밍 기록을 남기고<br>나비를 성장시켜보세요!</div><button class="px btn-first-record" onclick="openWriteModal()">첫 기록 남기기</button></div>'
    return
  }
  const sortedRecords=[...state.records].sort((a,b)=>{
    if(!!a.favorite!==!!b.favorite) return a.favorite ? -1 : 1
    if(a.favorite && b.favorite) return (b.favoritedAt||0)-(a.favoritedAt||0)
    return 0
  })
  el.innerHTML=sortedRecords.map(r=>`
    <div class="record-card" onclick="openDetailModal(${r.id})">
      <div class="card-header">
        <div><div class="px card-date">${r.date}</div><div class="card-gym">${r.favorite?`<img src="${ICON_FAVORITE}" alt="즐겨찾기" style="width:13px;height:13px;vertical-align:-2px;margin-right:3px;image-rendering:pixelated">`:''}${r.gym}</div></div>
        <div class="card-header-right">
          ${r.nabiGrew?`<div class="nabi-grow-badge"><span class="px nabi-grow-text">나비 성장</span></div>`:''}
          ${r.chalkReward>0?`<div class="card-reward"><img src="${ICON_CHALK}" style="width:15px;height:auto;image-rendering:pixelated;vertical-align:middle"><span class="px card-reward-text">+${r.chalkReward}꼬집</span></div>`:''}
        </div>
      </div>
      <div class="card-photo">${r.photo?`<img src="${r.photo}" style="width:100%;height:100%;object-fit:cover">`:`<div class="card-photo-empty">📷</div>`}</div>
      <div class="card-stats">
        ${gradeChipsHtml(r.grades)||(r.diff?`<div class="card-stat"><span>📊</span><span class="px card-stat-text">${r.diff}</span></div>`:'')}
        ${r.cond?`<div class="card-stat"><span class="px card-stat-text">${r.cond}</span></div>`:''}
        ${r.duration?`<div class="card-stat"><span>⏱</span><span class="px card-stat-text">${r.duration}분</span></div>`:''}
      </div>
    </div>`).join('')
}
function renderCalendar(){
  const el=document.getElementById('calView')
  const recordDates=new Set(state.records.map(r=>r.date))
  const today=todayStr()
  const firstDay=new Date(calYear,calMonth-1,1).getDay()
  const daysInMonth=new Date(calYear,calMonth,0).getDate()
  const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']
  const dayLabels=['일','월','화','수','목','금','토']
  let days=''
  for(let i=0;i<firstDay;i++) days+='<div></div>'
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    days+=`<div class="cal-day ${ds===today?'today':''} ${recordDates.has(ds)?'has-record':''} ${ds===selectedCalDate?'selected':''}" onclick="selectCalDate('${ds}')"><div class="day-num">${d}</div><div class="day-dot"></div></div>`
  }
  let sel=''
  if(selectedCalDate){
    const dr=state.records.filter(r=>r.date===selectedCalDate)
    sel=dr.length
      ?`<div class="cal-selected-records"><div class="px cal-selected-title">${selectedCalDate} 기록 ${dr.length}개</div>${dr.map(r=>`<div class="cal-record-item" onclick="openDetailModal(${r.id})"><span style="font-size:18px">🧗</span><div><div class="cal-record-gym">${r.gym}</div>${gradeChipsHtml(r.grades)||(r.diff?`<div class="px cal-record-sub">${r.diff}</div>`:'')}</div></div>`).join('')}</div>`
      :`<div class="cal-selected-records"><div class="px cal-empty">이 날은 기록이 없어요</div></div>`
  }
  el.innerHTML=`<div class="calendar-wrap"><div class="cal-header"><button class="px cal-nav" onclick="changeMonth(-1)">◀</button><div class="px cal-month">${calYear}. ${monthNames[calMonth-1]}</div><button class="px cal-nav" onclick="changeMonth(1)">▶</button></div><div class="cal-grid">${dayLabels.map(d=>`<div class="px cal-day-label">${d}</div>`).join('')}${days}</div>${sel}</div>`
}
function selectCalDate(d){selectedCalDate=selectedCalDate===d?null:d;renderCalendar()}
function changeMonth(dir){calMonth+=dir;if(calMonth>12){calMonth=1;calYear++}if(calMonth<1){calMonth=12;calYear--}renderCalendar()}
function openWriteModal(){
  editingRecordId=null
  document.getElementById('modalTitleText').textContent='기록 업로드'
  document.getElementById('btnSaveText').textContent='기록 저장하기'
  gradeCounts={}
  selectedPhoto=null
  renderGradeGrid()
  document.getElementById('inputGym').value=''
  document.getElementById('inputMemo').value=''
  document.getElementById('inputDate').value=todayStr()
  document.getElementById('inputCond').value=''
  document.getElementById('inputDur').value=''
  document.getElementById('inputPhotoFile').value=''
  document.getElementById('photoUploadBox').innerHTML='<div class="photo-upload-icon">📷</div><div class="px photo-upload-text">탭해서 사진 추가</div>'
  document.getElementById('optionalSection').classList.remove('show')
  document.getElementById('optToggleIcon').textContent='▶'
  document.getElementById('writeModalBackdrop').classList.add('show')
}
function handlePhotoSelect(e){
  const file=e.target.files[0]
  if(!file) return
  const reader=new FileReader()
  reader.onload=function(ev){
    selectedPhoto=ev.target.result
    document.getElementById('photoUploadBox').innerHTML=`<img src="${selectedPhoto}" style="width:100%;height:100%;object-fit:cover">`
  }
  reader.readAsDataURL(file)
}
function closeWriteModal(e){if(e&&e.target!==document.getElementById('writeModalBackdrop'))return;document.getElementById('writeModalBackdrop').classList.remove('show')}
// 색깔별 개수 그리드 렌더링
function renderGradeGrid(){
  const grid=document.getElementById('gradeGrid')
  grid.innerHTML=GRADE_COLORS.map(c=>{
    const n=gradeCounts[c.key]||0
    return `<div class="grade-row ${n>0?'on':''}">
      <div class="grade-dot" style="background:${c.hex}"></div>
      <div class="grade-name">${c.name}</div>
      <div class="grade-count-box">
        <button class="grade-btn" onclick="changeGrade('${c.key}',-1)">−</button>
        <div class="px grade-count">${n}</div>
        <button class="grade-btn" onclick="changeGrade('${c.key}',1)">+</button>
      </div>
    </div>`
  }).join('')
  document.getElementById('gradeTotal').textContent=gradeTotalCount()
}
function changeGrade(key,d){
  const n=Math.max(0,(gradeCounts[key]||0)+d)
  if(n===0) delete gradeCounts[key]; else gradeCounts[key]=n
  renderGradeGrid()
}
function gradeTotalCount(){return Object.values(gradeCounts).reduce((a,b)=>a+b,0)}
// 저장된 grades 객체 → 색 점 칩 HTML (카드/상세/캘린더 공용)
function gradeChipsHtml(grades){
  if(!grades) return ''
  const entries=GRADE_COLORS.filter(c=>grades[c.key]>0)
  if(entries.length===0) return ''
  return `<div class="grade-chips">${entries.map(c=>`<div class="grade-chip"><div class="grade-chip-dot" style="background:${c.hex}"></div><span class="grade-chip-num">${grades[c.key]}</span></div>`).join('')}</div>`
}
function toggleOptional(){const s=document.getElementById('optionalSection');const show=!s.classList.contains('show');s.classList.toggle('show',show);document.getElementById('optToggleIcon').textContent=show?'▼':'▶'}
function saveRecord(){
  const gym=document.getElementById('inputGym').value.trim()
  const date=document.getElementById('inputDate').value
  const memo=document.getElementById('inputMemo').value.trim()
  const cond=document.getElementById('inputCond').value
  const dur=parseInt(document.getElementById('inputDur').value)||0
  if(!selectedPhoto){alert('사진을 추가해주세요! 사진이 있어야 기록을 업로드할 수 있어요 📸');return}
  if(!gym){alert('클라이밍장 이름을 입력해주세요!');return}
  if(!date){alert('날짜를 입력해주세요!');return}
  const grades={...gradeCounts}
  const routes=gradeTotalCount()

  if(editingRecordId){
    const existing=state.records.find(r=>r.id===editingRecordId)
    if(existing){
      Object.assign(existing,{gym,date,routes,grades,memo,cond,duration:dur,photo:selectedPhoto})
    }
    document.getElementById('writeModalBackdrop').classList.remove('show')
    editingRecordId=null
    showToast('✏️ 기록이 수정됐어요!')
    updateHeader();renderFeed();renderCalendar()
    return
  }

  const isToday=date===todayStr()
  let nabiGrew=false
  if(isToday&&!state.todayRecorded&&state.nabiStage<5){state.nabiStage++;state.todayRecorded=true;nabiGrew=true}
  state.totalRecordCount++
  const r={id:Date.now(),date,gym,routes,grades,memo,cond,duration:dur,photo:selectedPhoto,chalkReward:0,nabiGrew}
  for(const m of[5,10,20]){if(state.totalRecordCount===m&&!state.rewardHistory.includes('total_record_'+m)){state.chalkCount++;r.chalkReward=1;state.rewardHistory.push('total_record_'+m);break}}
  state.records.unshift(r)
  document.getElementById('writeModalBackdrop').classList.remove('show')
  let msg='🎉 오늘의 클라이밍이 저장됐어요!'
  if(nabiGrew) msg='🐱 나비가 한 단계 성장했어요!'
  if(r.chalkReward>0) msg='<img src="'+ICON_CHALK+'" style="width:16px;height:auto;image-rendering:pixelated;vertical-align:middle"> +1꼬집을 획득했어요!'
  showToast(msg);updateHeader();renderFeed();renderCalendar()
}
function openDetailModal(id){
  const r=state.records.find(r=>r.id===id);if(!r)return
  currentDetailId=id
  document.getElementById('detailEditIcon').src=ICON_EDIT
  const favIcon=document.getElementById('detailFavIcon')
  favIcon.src=ICON_FAVORITE
  favIcon.classList.toggle('active', !!r.favorite)
  document.getElementById('detailGym').textContent=r.gym
  document.getElementById('detailDate').textContent=r.date
  document.getElementById('detailPhoto').innerHTML=r.photo?`<img src="${r.photo}" style="width:100%;height:100%;object-fit:cover">`:'🧗'
  document.getElementById('detailStats').innerHTML=`${gradeChipsHtml(r.grades)||(r.diff?`<div class="detail-stat"><span>📊</span><span class="px detail-stat-text">${r.diff}</span></div>`:'')} ${r.cond?`<div class="detail-stat"><span class="px detail-stat-text">${r.cond}</span></div>`:''} ${r.duration?`<div class="detail-stat"><span>⏱</span><span class="px detail-stat-text">${r.duration}분</span></div>`:''}`
  document.getElementById('detailMemo').textContent=r.memo||'메모 없음'
  document.getElementById('detailRewards').innerHTML=`${r.chalkReward>0?`<div class="detail-reward chalk"><img src="${ICON_CHALK}" style="width:15px;height:auto;image-rendering:pixelated;vertical-align:middle"> +${r.chalkReward}꼬집 획득</div>`:''}${r.nabiGrew?`<div class="detail-reward nabi">나비 성장</div>`:''}`
  document.getElementById('detailModalBackdrop').classList.add('show')
}
function closeDetailModal(e){if(e&&e.target!==document.getElementById('detailModalBackdrop'))return;document.getElementById('detailModalBackdrop').classList.remove('show')}
function toggleFavoriteRecord(){
  const r=state.records.find(r=>r.id===currentDetailId);if(!r)return
  r.favorite=!r.favorite
  if(r.favorite) r.favoritedAt=Date.now()
  const favIcon=document.getElementById('detailFavIcon')
  favIcon.classList.toggle('active', r.favorite)
  showToast(r.favorite?'⭐ 즐겨찾기에 추가했어요':'즐겨찾기를 해제했어요')
  renderFeed();renderCalendar()
}
function openEditModal(){
  const r=state.records.find(r=>r.id===currentDetailId);if(!r)return
  document.getElementById('detailModalBackdrop').classList.remove('show')
  editingRecordId=r.id
  gradeCounts={...r.grades}
  selectedPhoto=r.photo
  renderGradeGrid()
  document.getElementById('inputGym').value=r.gym
  document.getElementById('inputDate').value=r.date
  document.getElementById('inputMemo').value=r.memo||''
  document.getElementById('inputCond').value=r.cond||''
  document.getElementById('inputDur').value=r.duration||''
  if(r.cond||r.duration){
    document.getElementById('optionalSection').classList.add('show')
    document.getElementById('optToggleIcon').textContent='▼'
  }
  document.getElementById('inputPhotoFile').value=''
  document.getElementById('photoUploadBox').innerHTML=r.photo?`<img src="${r.photo}" style="width:100%;height:100%;object-fit:cover">`:'<div class="photo-upload-icon">📷</div><div class="px photo-upload-text">탭해서 사진 추가</div>'
  document.getElementById('modalTitleText').textContent='기록 수정'
  document.getElementById('btnSaveText').textContent='수정 완료'
  document.getElementById('writeModalBackdrop').classList.add('show')
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
init()
</script>
